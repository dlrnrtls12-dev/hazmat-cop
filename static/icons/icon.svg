<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Outer Shield Shadow/Glow -->
  <path d="M 256,60 L 410,120 C 410,290 340,395 256,445 C 172,395 102,290 102,120 Z" fill="rgba(37,99,235,0.2)"/>
  
  <!-- Main Shield -->
  <path d="M 256,75 L 395,130 C 395,280 330,380 256,428 C 182,380 117,280 117,130 Z" fill="url(#shield)" stroke="#60a5fa" stroke-width="8"/>
  
  <!-- Inner Flame Symbol -->
  <path d="M 256,160 C 275,220 330,250 330,310 C 330,360 295,390 256,390 C 217,390 182,360 182,310 C 182,260 225,230 236,190 C 242,215 258,230 268,230 C 255,210 250,185 256,160 Z" fill="url(#flame)"/>
</svg>
